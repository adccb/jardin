  help:
    title: "⌨️ keyboard magic"
    rows:
      create:
        keys_html: "<kbd>c</kbd>"
        does: "plant a new task"
      save:
        keys_html: "<kbd>enter</kbd>"
        does: "save it (in the new task box)"
      move:
        keys_html: "<kbd>↑</kbd> <kbd>↓</kbd> or <kbd>k</kbd> <kbd>j</kbd>"
        does: "move between tasks"
      toggle:
        keys_html: "<kbd>x</kbd> or <kbd>space</kbd>"
        does: "mark done / not done"
      delete:
        keys_html: "<kbd>⌫</kbd> or <kbd>delete</kbd>"
        does: "delete the focused task"
      undo:
        keys_html: "<kbd>u</kbd>"
        does: "undo the last delete"
      done_list:
        keys_html: "<kbd>d</kbd>"
        does: "open / close the done list"
      close:
        keys_html: "<kbd>esc</kbd>"
        does: "close any box"
      open_todoist:
        keys_html: "<kbd>o</kbd>"
        does: "open a todoist task in todoist"
